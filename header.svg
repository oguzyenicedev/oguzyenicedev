        <animate attributeName="cx" values="515;500;520;515" dur="3.9s" begin="2.1s" repeatCount="indefinite" />
      </circle>
      <circle cx="640" cy="-10" r="3" opacity="0.9">
        <animate attributeName="cy" from="-10" to="210" dur="4.8s" begin="0.8s" repeatCount="indefinite" />
        <animate attributeName="cx" values="640;660;635;640" dur="4.8s" begin="0.8s" repeatCount="indefinite" />
      </circle>
      <circle cx="755" cy="-10" r="2.5" opacity="0.8">
        <animate attributeName="cy" from="-10" to="210" dur="4.3s" begin="1.7s" repeatCount="indefinite" />
      </circle>

      <circle cx="55" cy="-10" r="1.5" opacity="0.45"><animate attributeName="cy" from="-10" to="210" dur="7s" begin="0.3s" repeatCount="indefinite" /></circle>
      <circle cx="165" cy="-10" r="1.4" opacity="0.5"><animate attributeName="cy" from="-10" to="210" dur="6.4s" begin="2.5s" repeatCount="indefinite" /></circle>
      <circle cx="295" cy="-10" r="1.6" opacity="0.4"><animate attributeName="cy" from="-10" to="210" dur="7.8s" begin="1.1s" repeatCount="indefinite" /></circle>
      <circle cx="445" cy="-10" r="1.3" opacity="0.5"><animate attributeName="cy" from="-10" to="210" dur="6.8s" begin="3.0s" repeatCount="indefinite" /></circle>
      <circle cx="575" cy="-10" r="1.5" opacity="0.45"><animate attributeName="cy" from="-10" to="210" dur="7.2s" begin="0.7s" repeatCount="indefinite" /></circle>
      <circle cx="695" cy="-10" r="1.4" opacity="0.5"><animate attributeName="cy" from="-10" to="210" dur="6.5s" begin="1.9s" repeatCount="indefinite" /></circle>
