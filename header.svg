      <line x1="600" y1="6" x2="600" y2="56" class="string" />
      <rect x="597" y="54" width="6" height="4" fill="#cbd5e1" />
      <circle cx="600" cy="67" r="10" fill="url(#redBall)" />
    </g>


    <text x="402" y="107" class="title" fill="#000000" opacity="0.45">Oguz Yenice</text>
    <text x="400" y="105" class="title">Oguz Yenice</text>
    <text x="400" y="134" class="subtitle">BACKEND & SYSTEM ARCHITECTURE</text>

   
    <g fill="#ffffff">
      <circle cx="95" cy="-10" r="3" opacity="0.85">
        <animate attributeName="cy" from="-10" to="210" dur="4.2s" repeatCount="indefinite" />
        <animate attributeName="cx" values="95;110;90;95" dur="4.2s" repeatCount="indefinite" />
      </circle>
      <circle cx="240" cy="-10" r="2.8" opacity="0.9">
        <animate attributeName="cy" from="-10" to="210" dur="5.1s" begin="1.2s" repeatCount="indefinite" />
        <animate attributeName="cx" values="240;225;245;240" dur="5.1s" begin="1.2s" repeatCount="indefinite" />
      </circle>
      <circle cx="370" cy="-10" r="3.2" opacity="0.8">
        <animate attributeName="cy" from="-10" to="210" dur="4.6s" begin="0.5s" repeatCount="indefinite" />
        <animate attributeName="cx" values="370;390;365;370" dur="4.6s" begin="0.5s" repeatCount="indefinite" />
      </circle>
      <circle cx="515" cy="-10" r="2.6" opacity="0.85">
