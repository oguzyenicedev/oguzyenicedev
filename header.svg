<svg viewBox="0 0 800 200" width="800" height="200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gece Gökyüzü Gradyanı -->
    <linearGradient id="nightSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="55%" stop-color="#0d1527" />
      <stop offset="100%" stop-color="#182644" />
    </linearGradient>

    <!-- Altın Yaldızlı Başlık Gradyanı -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fffdf5" />
      <stop offset="50%" stop-color="#ffdf80" />
      <stop offset="100%" stop-color="#fffdf5" />
    </linearGradient>

    <!-- Çam Ağacı Gradyanı -->
    <linearGradient id="pineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f6f43" />
      <stop offset="100%" stop-color="#0b3820" />
    </linearGradient>

    <!-- Kırmızı Süs Gradyanı -->
    <radialGradient id="redBall" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ff8585" />
      <stop offset="45%" stop-color="#e61919" />
      <stop offset="100%" stop-color="#7a0000" />
    </radialGradient>

    <!-- Altın Süs Gradyanı -->
    <radialGradient id="goldBall" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fff6cc" />
      <stop offset="45%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#713f12" />
    </radialGradient>

    <!-- Kızağın Arkasındaki Sihirli Toz İzi Gradyanı -->
    <linearGradient id="magicTrail" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fde047" stop-opacity="0" />
      <stop offset="100%" stop-color="#fde047" stop-opacity="0.75" />
    </linearGradient>

    <!-- Banner Dışına Taşan Efektleri Kırpma Maskesi -->
    <clipPath id="bannerClip">
      <rect width="800" height="200" rx="14" />
    </clipPath>
  </defs>

  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 44px;
      fill: url(#goldGrad);
      text-anchor: middle;
      letter-spacing: 1.5px;
    }
    .subtitle {
      font-family: 'Fira Code', 'Courier New', monospace;
      font-weight: 600;
      font-size: 13px;
      fill: #93c5fd;
      text-anchor: middle;
      letter-spacing: 4px;
    }
    .wire {
      fill: none;
      stroke: #26334d;
      stroke-width: 2;
    }
    .string {
      stroke: #64748b;
      stroke-width: 1.5;
    }
  </style>

  <g clip-path="url(#bannerClip)">
    <!-- Arka Plan -->
    <rect width="800" height="200" rx="14" fill="url(#nightSky)" />

    <!-- Parıldayan Arka Plan Yıldızları -->
    <g fill="#ffffff">
      <circle cx="120" cy="45" r="1.2"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="2.5s" repeatCount="indefinite" /></circle>
      <circle cx="260" cy="30" r="1.5"><animate attributeName="opacity" values="0.8;0.2;0.8" dur="3.2s" repeatCount="indefinite" /></circle>
      <circle cx="420" cy="25" r="1"><animate attributeName="opacity" values="0.2;1;0.2" dur="2s" repeatCount="indefinite" /></circle>
      <circle cx="580" cy="35" r="1.5"><animate attributeName="opacity" values="0.9;0.1;0.9" dur="2.8s" repeatCount="indefinite" /></circle>
      <circle cx="670" cy="60" r="1.2"><animate attributeName="opacity" values="0.2;0.8;0.2" dur="3.5s" repeatCount="indefinite" /></circle>
    </g>

    <!-- Parlayan Dolunay (Sağ Üst) -->
    <g transform="translate(715, 52)">
      <circle cx="0" cy="0" r="34" fill="#fef08a" opacity="0.12">
        <animate attributeName="r" values="30;38;30" dur="4s" repeatCount="indefinite" />
      </circle>
      <circle cx="0" cy="0" r="24" fill="#fef08a" opacity="0.22" />
      <circle cx="0" cy="0" r="18" fill="#fef9c3" />
    </g>

    <!-- HIZLA KAYIP GEÇEN NOEL BABA VE KIZAĞI -->
    <g>
      <!-- Gökyüzünde Kavisli Uçuş Rotası (3.2 saniyede hızla geçer, 5.8 saniye bekler) -->
      <animateMotion path="M -220,135 Q 380,15 980,45" dur="9s" keyTimes="0; 0.35; 1" keyPoints="0; 1; 1" calcMode="linear" rotate="auto" repeatCount="indefinite" />

      <!-- Sihirli Altın Toz İzi ve Kıvılcımlar -->
      <path d="M -95,4 L 0,2 L 0,7 Z" fill="url(#magicTrail)" />
      <circle cx="-25" cy="2" r="2" fill="#fde047">
        <animate attributeName="opacity" values="1;0.1;1" dur="0.3s" repeatCount="indefinite" />
      </circle>
      <circle cx="-50" cy="6" r="1.5" fill="#ffffff">
        <animate attributeName="opacity" values="0.2;1;0.2" dur="0.25s" repeatCount="indefinite" />
      </circle>
      <circle cx="-75" cy="3" r="1.2" fill="#fde047">
        <animate attributeName="opacity" values="0.8;0;0.8" dur="0.4s" repeatCount="indefinite" />
      </circle>

      <!-- Kızak Kızakları (Altın) -->
      <path d="M -5,12 L 32,12 Q 42,12 45,3" fill="none" stroke="#facc15" stroke-width="2" stroke-linecap="round" />
      <line x1="5" y1="6" x2="5" y2="12" stroke="#facc15" stroke-width="1.5" />
      <line x1="24" y1="6" x2="24" y2="12" stroke="#facc15" stroke-width="1.5" />

      <!-- Kızak Gövdesi (Kırmızı & Altın Şeritli) -->
      <path d="M 0,6 L 30,6 Q 35,6 37,-3 L 26,-3 Q 22,2 14,2 L 4,-5 L -3,-5 Z" fill="#dc2626" />
      <path d="M 0,2 L 28,2" stroke="#facc15" stroke-width="1" />

      <!-- Hediye Çuvalı -->
      <circle cx="5" cy="-7" r="6" fill="#92400e" />
      <circle cx="9" cy="-9" r="4" fill="#b45309" />

 
      <circle cx="18" cy="-5" r="5.5" fill="#dc2626" /> <!-- Gövde -->
      <circle cx="19" cy="-12" r="3.5" fill="#fed7aa" /> <!-- Yüz -->
      <path d="M 18,-11 Q 23,-9 24,-5 Q 19,-5 17,-9 Z" fill="#ffffff" /> <!-- Beyaz Sakal -->
      <polygon points="16,-14 22,-14 14,-20" fill="#dc2626" /> <!-- Şapka -->
      <circle cx="14" cy="-20" r="1.8" fill="#ffffff" /> <!-- Şapka Ponponu -->

 
      <path d="M 23,-7 Q 45,-2 66,-6" fill="none" stroke="#fef08a" stroke-width="0.8" opacity="0.6" />


      <g transform="translate(48, -2)">
        <g>
          <animateTransform attributeName="transform" type="rotate" values="-8 10 0; 8 10 0; -8 10 0" dur="0.35s" repeatCount="indefinite" />
          <ellipse cx="10" cy="0" rx="7" ry="3.5" fill="#854d0e" />
          <path d="M 14,-2 L 18,-8 L 22,-6 L 17,0 Z" fill="#854d0e" />
          <path d="M 18,-8 L 16,-13 M 18,-10 L 21,-12" stroke="#ca8a04" stroke-width="1.2" stroke-linecap="round" />
          <line x1="5" y1="2" x2="1" y2="9" stroke="#713f12" stroke-width="1.5" stroke-linecap="round" />
          <line x1="15" y1="2" x2="20" y2="8" stroke="#713f12" stroke-width="1.5" stroke-linecap="round" />
        </g>
      </g>


      <g transform="translate(74, -4)">
        <g>
          <animateTransform attributeName="transform" type="rotate" values="8 10 0; -8 10 0; 8 10 0" dur="0.35s" repeatCount="indefinite" />
          <ellipse cx="10" cy="0" rx="7" ry="3.5" fill="#a16207" />
          <path d="M 14,-2 L 18,-8 L 22,-6 L 17,0 Z" fill="#a16207" />
          <path d="M 18,-8 L 16,-13 M 18,-10 L 21,-12" stroke="#eab308" stroke-width="1.2" stroke-linecap="round" />
          <line x1="5" y1="2" x2="0" y2="8" stroke="#854d0e" stroke-width="1.5" stroke-linecap="round" />
          <line x1="15" y1="2" x2="21" y2="7" stroke="#854d0e" stroke-width="1.5" stroke-linecap="round" />
          <!-- Rudolph'un Parlayan Kırmızı Burnu -->
          <circle cx="22.5" cy="-6" r="2" fill="#ff0000">
            <animate attributeName="r" values="1.5;2.8;1.5" dur="0.4s" repeatCount="indefinite" />
          </circle>
        </g>
      </g>
    </g>

  
    <path d="M 0 168 Q 180 140 380 168 T 800 158 L 800 200 L 0 200 Z" fill="#1e293b" opacity="0.7" />

    <path d="M 0 178 Q 260 162 520 180 T 800 172 L 800 200 L 0 200 Z" fill="#cbd5e1" opacity="0.9" />
    <path d="M 0 185 Q 320 174 600 188 T 800 182 L 800 200 L 0 200 Z" fill="#f8fafc" />

  
    <g transform="translate(45, 78)">
