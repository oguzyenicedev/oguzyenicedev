<svg viewBox="0 0 800 200" width="800" height="200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="nightSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="55%" stop-color="#0d1527" />
      <stop offset="100%" stop-color="#182644" />
    </linearGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fffdf5" />
      <stop offset="50%" stop-color="#ffdf80" />
      <stop offset="100%" stop-color="#fffdf5" />
    </linearGradient>

    <linearGradient id="pineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f6f43" />
      <stop offset="100%" stop-color="#0b3820" />
    </linearGradient>

    <radialGradient id="redBall" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ff8585" />
      <stop offset="45%" stop-color="#e61919" />
      <stop offset="100%" stop-color="#7a0000" />
    </radialGradient>

    <radialGradient id="goldBall" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#fff6cc" />
      <stop offset="45%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#713f12" />
    </radialGradient>

    <linearGradient id="magicTrail" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fde047" stop-opacity="0" />
      <stop offset="100%" stop-color="#fde047" stop-opacity="0.75" />
    </linearGradient>

    <clipPath id="bannerClip">
      <rect width="800" height="200" rx="14" />
    </clipPath>
  </defs>

  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      font-weight: 800;
      font-size: 44px;
      fill: url(#goldGrad);
      text-anchor: middle;
      letter-spacing: 1.5px;
    }
    .subtitle {
      font-family: 'Fira Code', 'Courier New', monospace;
      font-weight: 600;
      font-size: 13px;
      fill: #93c5fd;
      text-anchor: middle;
      letter-spacing: 4px;
    }
    .wire { fill: none; stroke: #26334d; stroke-width: 2; }
    .string { stroke: #64748b; stroke-width: 1.5; }

    /* Işıklar ve Yıldızlar */
    .tw1 { animation: pulse 2s infinite alternate; }
    .tw2 { animation: pulse 1.4s 0.5s infinite alternate; }
    .tw3 { animation: pulse 1.1s 0.2s infinite alternate; }
    .nose { animation: noseGlow 0.35s infinite alternate; }

    @keyframes pulse { 0% { opacity: 0.25; } 100% { opacity: 1; } }
    @keyframes noseGlow { 0% { opacity: 0.4; } 100% { opacity: 1; } }

    /* Sallanan Yılbaşı Süsleri (Sarkaç) */
    .sw1 { transform-origin: 200px 6px; animation: swing1 3.2s ease-in-out infinite alternate; }
    .sw2 { transform-origin: 400px 6px; animation: swing2 3.8s ease-in-out infinite alternate; }
    .sw3 { transform-origin: 600px 6px; animation: swing1 3.4s ease-in-out infinite alternate; }

    @keyframes swing1 { 0% { transform: rotate(-6deg); } 100% { transform: rotate(6deg); } }
    @keyframes swing2 { 0% { transform: rotate(5deg); } 100% { transform: rotate(-5deg); } }

    /* NOEL BABA HIZLI UÇUŞ ROTASI (CSS Keyframes) */
    .santa-flight {
      animation: flyAcross 8s linear infinite;
    }
    @keyframes flyAcross {
      0%   { transform: translate(-220px, 130px) rotate(-14deg); }
      14%  { transform: translate(120px, 55px) rotate(-8deg); }
      28%  { transform: translate(480px, 22px) rotate(2deg); }
      42%  { transform: translate(920px, 48px) rotate(8deg); }
      100% { transform: translate(920px, 48px) rotate(8deg); }
    }

    /* Dörtnala Koşan Geyikler */
    .deer1 { transform-origin: 58px -2px; animation: gallop1 0.3s ease-in-out infinite alternate; }
    .deer2 { transform-origin: 84px -4px; animation: gallop2 0.3s ease-in-out infinite alternate; }
    @keyframes gallop1 { 0% { transform: rotate(-8deg); } 100% { transform: rotate(8deg); } }
    @keyframes gallop2 { 0% { transform: rotate(8deg); } 100% { transform: rotate(-8deg); } }

    /* Katmanlı Kar Fırtınası */
    .sn1 { animation: snowFall1 4.2s linear infinite; }
    .sn2 { animation: snowFall2 5.1s linear 1.2s infinite; }
    .sn3 { animation: snowFall1 4.6s linear 0.5s infinite; }
    .sn4 { animation: snowFall2 3.9s linear 2.1s infinite; }
    .sn5 { animation: snowFall1 4.8s linear 0.8s infinite; }
    .sn6 { animation: snowFall2 6.8s linear 0.3s infinite; }
    .sn7 { animation: snowFall1 7.4s linear 1.8s infinite; }

    @keyframes snowFall1 {
      0%   { transform: translate(0px, -10px); opacity: 0; }
      15%  { opacity: 0.85; }
      50%  { transform: translate(14px, 100px); }
      100% { transform: translate(-6px, 215px); opacity: 0.15; }
    }
    @keyframes snowFall2 {
      0%   { transform: translate(0px, -10px); opacity: 0; }
      15%  { opacity: 0.85; }
      50%  { transform: translate(-14px, 100px); }
      100% { transform: translate(8px, 215px); opacity: 0.15; }
    }
  </style>

  <g clip-path="url(#bannerClip)">
    <!-- Gece Gökyüzü -->
    <rect width="800" height="200" rx="14" fill="url(#nightSky)" />

    <!-- Yıldızlar -->
    <g fill="#ffffff">
      <circle cx="120" cy="45" r="1.2" class="tw1" />
      <circle cx="260" cy="30" r="1.5" class="tw2" />
      <circle cx="420" cy="25" r="1.2" class="tw3" />
      <circle cx="580" cy="35" r="1.5" class="tw1" />
      <circle cx="670" cy="60" r="1.2" class="tw2" />
    </g>

    <!-- Parlayan Dolunay (Sağ Üst) -->
    <g transform="translate(715, 52)">
      <circle cx="0" cy="0" r="34" fill="#fef08a" opacity="0.12" class="tw1" />
      <circle cx="0" cy="0" r="24" fill="#fef08a" opacity="0.22" />
      <circle cx="0" cy="0" r="18" fill="#fef9c3" />
    </g>

    <!-- HIZLA KAYIP GEÇEN NOEL BABA VE KIZAĞI -->
    <g class="santa-flight">
      <!-- Sihirli Altın Toz İzi -->
      <path d="M -95,4 L 0,2 L 0,7 Z" fill="url(#magicTrail)" />
      <circle cx="-25" cy="2" r="2" fill="#fde047" class="tw3" />
      <circle cx="-50" cy="6" r="1.5" fill="#ffffff" class="tw2" />
      <circle cx="-75" cy="3" r="1.2" fill="#fde047" class="tw1" />

      <!-- Kızak Kızakları -->
      <path d="M -5,12 L 32,12 Q 42,12 45,3" fill="none" stroke="#facc15" stroke-width="2" stroke-linecap="round" />
      <line x1="5" y1="6" x2="5" y2="12" stroke="#facc15" stroke-width="1.5" />
      <line x1="24" y1="6" x2="24" y2="12" stroke="#facc15" stroke-width="1.5" />

      <!-- Kızak Gövdesi -->
      <path d="M 0,6 L 30,6 Q 35,6 37,-3 L 26,-3 Q 22,2 14,2 L 4,-5 L -3,-5 Z" fill="#dc2626" />
      <path d="M 0,2 L 28,2" stroke="#facc15" stroke-width="1" />

      <!-- Hediye Çuvalı -->
      <circle cx="5" cy="-7" r="6" fill="#92400e" />
      <circle cx="9" cy="-9" r="4" fill="#b45309" />

      <!-- Noel Baba -->
      <circle cx="18" cy="-5" r="5.5" fill="#dc2626" />
      <circle cx="19" cy="-12" r="3.5" fill="#fed7aa" />
      <path d="M 18,-11 Q 23,-9 24,-5 Q 19,-5 17,-9 Z" fill="#ffffff" />
      <polygon points="16,-14 22,-14 14,-20" fill="#dc2626" />
      <circle cx="14" cy="-20" r="1.8" fill="#ffffff" />

      <!-- Dizginler -->
      <path d="M 23,-7 Q 45,-2 66,-6" fill="none" stroke="#fef08a" stroke-width="0.8" opacity="0.6" />

      <!-- Koşan Ren Geyiği 1 -->
      <g class="deer1">
        <ellipse cx="58" cy="-2" rx="7" ry="3.5" fill="#854d0e" />
        <path d="M 62,-4 L 66,-10 L 70,-8 L 65,-2 Z" fill="#854d0e" />
        <path d="M 66,-10 L 64,-15 M 66,-12 L 69,-14" stroke="#ca8a04" stroke-width="1.2" stroke-linecap="round" />
        <line x1="53" y1="0" x2="49" y2="7" stroke="#713f12" stroke-width="1.5" stroke-linecap="round" />
        <line x1="63" y1="0" x2="68" y2="6" stroke="#713f12" stroke-width="1.5" stroke-linecap="round" />
      </g>

      <!-- Koşan Ren Geyiği 2 (Kırmızı Burunlu Rudolph) -->
      <g class="deer2">
        <ellipse cx="84" cy="-4" rx="7" ry="3.5" fill="#a16207" />
        <path d="M 88,-6 L 92,-12 L 96,-10 L 91,-4 Z" fill="#a16207" />
        <path d="M 92,-12 L 90,-17 M 92,-14 L 95,-16" stroke="#eab308" stroke-width="1.2" stroke-linecap="round" />
        <line x1="79" y1="-2" x2="74" y2="4" stroke="#854d0e" stroke-width="1.5" stroke-linecap="round" />
        <line x1="89" y1="-2" x2="95" y2="3" stroke="#854d0e" stroke-width="1.5" stroke-linecap="round" />
        <circle cx="96.5" cy="-10" r="2.2" fill="#ff0000" class="nose" />
      </g>
    </g>

    <!-- Karlı Tepeler ve Zemin -->
    <path d="M 0 168 Q 180 140 380 168 T 800 158 L 800 200 L 0 200 Z" fill="#1e293b" opacity="0.7" />
    <path d="M 0 178 Q 260 162 520 180 T 800 172 L 800 200 L 0 200 Z" fill="#cbd5e1" opacity="0.9" />
    <path d="M 0 185 Q 320 174 600 188 T 800 182 L 800 200 L 0 200 Z" fill="#f8fafc" />

    <!-- Sol Çam Ağacı -->
    <g transform="translate(45, 78)">
      <rect x="25" y="88" width="10" height="16" rx="2" fill="#451a03" />
      <polygon points="30,38 2,90 58,90" fill="url(#pineGrad)" />
      <polygon points="30,18 7,66 53,66" fill="url(#pineGrad)" />
      <polygon points="30,0 13,42 47,42" fill="url(#pineGrad)" />
      <circle cx="30" cy="0" r="4.5" fill="#fde047" class="tw3" />
      <circle cx="22" cy="34" r="2.5" fill="#ff4b4b" class="tw2" />
      <circle cx="38" cy="48" r="2.5" fill="#fde047" class="tw1" />
      <circle cx="18" cy="58" r="2.5" fill="#38bdf8" class="tw3" />
      <circle cx="34" cy="72" r="2.5" fill="#ff4b4b" class="tw1" />
      <circle cx="20" cy="80" r="2.5" fill="#4ade80" class="tw2" />
      <circle cx="44" cy="82" r="2.5" fill="#fde047" class="tw3" />
    </g>

    <!-- Sağ Küçük Çam Ağacı -->
    <g transform="translate(650, 102) scale(0.8)">
      <rect x="25" y="88" width="10" height="16" rx="2" fill="#451a03" />
      <polygon points="30,38 2,90 58,90" fill="url(#pineGrad)" />
      <polygon points="30,18 7,66 53,66" fill="url(#pineGrad)" />
      <polygon points="30,0 13,42 47,42" fill="url(#pineGrad)" />
      <circle cx="30" cy="0" r="4.5" fill="#fde047" class="tw2" />
      <circle cx="25" cy="36" r="3" fill="#38bdf8" class="tw1" />
      <circle cx="36" cy="56" r="3" fill="#ff4b4b" class="tw3" />
      <circle cx="20" cy="76" r="3" fill="#fde047" class="tw2" />
      <circle cx="42" cy="78" r="3" fill="#4ade80" class="tw1" />
    </g>

    <!-- Üst Kavisli Işık Kabloları -->
    <path d="M 0,6 Q 100,34 200,6 Q 300,34 400,6 Q 500,34 600,6 Q 700,34 800,6" class="wire" />

    <!-- Kablo Üzerindeki Ampuller -->
    <g>
      <circle cx="50" cy="16" r="4.5" fill="#ff4b4b" class="tw3" />
      <circle cx="100" cy="20" r="4.5" fill="#4ade80" class="tw2" />
      <circle cx="150" cy="16" r="4.5" fill="#fde047" class="tw1" />
      <circle cx="250" cy="16" r="4.5" fill="#38bdf8" class="tw2" />
      <circle cx="300" cy="20" r="4.5" fill="#ff4b4b" class="tw3" />
      <circle cx="350" cy="16" r="4.5" fill="#fde047" class="tw1" />
      <circle cx="450" cy="16" r="4.5" fill="#4ade80" class="tw2" />
      <circle cx="500" cy="20" r="4.5" fill="#ff4b4b" class="tw3" />
      <circle cx="550" cy="16" r="4.5" fill="#38bdf8" class="tw1" />
      <circle cx="650" cy="16" r="4.5" fill="#fde047" class="tw2" />
    </g>

    <!-- Rüzgarda Sallanan Yılbaşı Süsleri -->
    <g class="sw1">
      <line x1="200" y1="6" x2="200" y2="52" class="string" />
      <rect x="197" y="50" width="6" height="4" fill="#cbd5e1" />
      <circle cx="200" cy="63" r="10" fill="url(#redBall)" />
    </g>

    <g class="sw2">
      <line x1="400" y1="6" x2="400" y2="36" class="string" />
      <rect x="397" y="34" width="6" height="4" fill="#cbd5e1" />
      <circle cx="400" cy="45" r="8.5" fill="url(#goldBall)" />
    </g>

    <g class="sw3">
      <line x1="600" y1="6" x2="600" y2="56" class="string" />
      <rect x="597" y="54" width="6" height="4" fill="#cbd5e1" />
      <circle cx="600" cy="67" r="10" fill="url(#redBall)" />
    </g>

    <!-- Merkez İsim ve Alt Başlık -->
    <text x="402" y="107" class="title" fill="#000000" opacity="0.45">Oguz Yenice</text>
    <text x="400" y="105" class="title">Oguz Yenice</text>
    <text x="400" y="134" class="subtitle">BACKEND & SYSTEM ARCHITECTURE</text>

    <!-- Katmanlı Kar Yağışı -->
    <g fill="#ffffff">
      <circle cx="95" cy="0" r="3" class="sn1" />
      <circle cx="240" cy="0" r="2.8" class="sn2" />
      <circle cx="370" cy="0" r="3.2" class="sn3" />
      <circle cx="515" cy="0" r="2.6" class="sn4" />
      <circle cx="640" cy="0" r="3" class="sn5" />
      <circle cx="755" cy="0" r="2.5" class="sn1" />
      <circle cx="55" cy="0" r="1.5" class="sn6" />
      <circle cx="165" cy="0" r="1.4" class="sn7" />
      <circle cx="295" cy="0" r="1.6" class="sn6" />
      <circle cx="445" cy="0" r="1.3" class="sn7" />
      <circle cx="575" cy="0" r="1.5" class="sn6" />
      <circle cx="695" cy="0" r="1.4" class="sn7" />
    </g>
  </g>

  <rect width="800" height="200" rx="14" fill="none" stroke="#1e293b" stroke-width="2" />
</svg>
