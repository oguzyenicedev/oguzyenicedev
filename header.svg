<svg viewBox="0 0 800 120" width="800" height="120" xmlns="http://www.w3.org/2000/svg">
  <style>
    .bg { fill: #0d1117; }
    .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-weight: 700; font-size: 38px; fill: #ffffff; text-anchor: middle; }
    
    .snow { fill: #ffffff; opacity: 0.8; animation: fall linear infinite; }
    .s1 { animation-duration: 4.5s; }
    .s2 { animation-duration: 6.5s; animation-delay: 2s; }
    .s3 { animation-duration: 3.5s; animation-delay: 1s; }
    
    @keyframes fall {
      0% { transform: translateY(-15px); opacity: 0; }
      20% { opacity: 0.85; }
      100% { transform: translateY(130px); opacity: 0.1; }
    }

    .light-red { fill: #ff4b4b; animation: pulse 1.2s infinite alternate; }
    .light-green { fill: #2ea043; animation: pulse 1.2s 0.4s infinite alternate; }
    .light-gold { fill: #e3b341; animation: pulse 1.2s 0.8s infinite alternate; }

    @keyframes pulse {
      0% { opacity: 0.3; }
      100% { opacity: 1; }
    }

    .tree-leaf { fill: #2ea043; }
    .tree-leaf-dark { fill: #238636; }
    .tree-trunk { fill: #8b5a2b; }
  </style>

  <rect width="800" height="120" rx="10" class="bg" />


  <circle cx="50" cy="18" r="5" class="light-red" />
  <circle cx="150" cy="18" r="5" class="light-green" />
  <circle cx="250" cy="18" r="5" class="light-gold" />
  <circle cx="350" cy="18" r="5" class="light-red" />
  <circle cx="450" cy="18" r="5" class="light-green" />
  <circle cx="550" cy="18" r="5" class="light-gold" />
  <circle cx="650" cy="18" r="5" class="light-red" />
  <circle cx="750" cy="18" r="5" class="light-green" />

  <!-- Kar taneleri -->
  <circle cx="80" cy="0" r="2.5" class="snow s1" />
  <circle cx="180" cy="0" r="1.8" class="snow s3" />
  <circle cx="280" cy="0" r="1.5" class="snow s2" />
  <circle cx="380" cy="0" r="3" class="snow s3" />
  <circle cx="480" cy="0" r="2" class="snow s1" />
  <circle cx="580" cy="0" r="2.5" class="snow s2" />
  <circle cx="680" cy="0" r="1.8" class="snow s3" />
  <circle cx="740" cy="0" r="2.2" class="snow s1" />


  <g transform="translate(225, 42)">
    <rect x="12" y="34" width="6" height="8" rx="1" class="tree-trunk" />
    <polygon points="15,16 1,35 29,35" class="tree-leaf-dark" />
    <polygon points="15,9 4,26 26,26" class="tree-leaf" />
    <polygon points="15,2 7,17 23,17" class="tree-leaf-dark" />
    <circle cx="15" cy="2" r="3" class="light-gold" />
    <circle cx="11" cy="22" r="2" class="light-red" />
    <circle cx="20" cy="30" r="2" class="light-gold" />
  </g>

 
  <text x="400" y="78" class="title">Oguz Yenice</text>

 
  <g transform="translate(545, 42)">
    <rect x="12" y="34" width="6" height="8" rx="1" class="tree-trunk" />
    <polygon points="15,16 1,35 29,35" class="tree-leaf-dark" />
    <polygon points="15,9 4,26 26,26" class="tree-leaf" />
    <polygon points="15,2 7,17 23,17" class="tree-leaf-dark" />
    <circle cx="15" cy="2" r="3" class="light-gold" />
    <circle cx="19" cy="22" r="2" class="light-red" />
    <circle cx="10" cy="30" r="2" class="light-gold" />
  </g>
</svg>
