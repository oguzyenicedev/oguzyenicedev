<svg viewBox="0 0 800 200" width="800" height="200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Arka Plan Gradientleri -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="40%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#171e36" />
    </linearGradient>
    
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="50%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>
    
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <linearGradient id="handGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Filtreler -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
    
    <filter id="cardGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComponentTransfer in="blur" result="glow">
        <feFuncA type="linear" slope="0.5" />
      </feComponentTransfer>
      <feMerge>
        <feMergeNode in="glow" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="shadow">
      <feDropShadow dx="-2" dy="5" stdDeviation="4" flood-color="#000000" flood-opacity="0.9" />
    </filter>
    
    <filter id="textShadow">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.9" />
    </filter>

    <clipPath id="bannerClip">
      <rect width="800" height="200" rx="14" />
    </clipPath>
  </defs>

  <g clip-path="url(#bannerClip)">
    <!-- 1. ARKA PLAN VE KIŞ ATMOSFERİ -->
    <rect width="800" height="200" fill="url(#bg)" />

    <!-- Matrix/Tech Izgarası (Daha Profesyonel/Hafif) -->
    <path d="M0,40 L800,40 M0,80 L800,80 M0,120 L800,120 M0,160 L800,160" stroke="#ffffff" stroke-width="0.5" opacity="0.03" />
    <path d="M100,0 L100,200 M200,0 L200,200 M300,0 L300,200 M400,0 L400,200 M500,0 L500,200 M600,0 L600,200 M700,0 L700,200" stroke="#ffffff" stroke-width="0.5" opacity="0.03" />

    <!-- Dinamik Kar / Veri Parçacıkları -->
    <g fill="#ffffff">
      <circle cx="320" cy="45" r="1.5"><animate attributeName="opacity" values="0.1;0.9;0.1" dur="3s" repeatCount="indefinite" /></circle>
      <circle cx="480" cy="30" r="1.2"><animate attributeName="opacity" values="0.3;1;0.3" dur="2.2s" repeatCount="indefinite" /></circle>
      <circle cx="620" cy="25" r="1.8"><animate attributeName="opacity" values="0.2;0.8;0.2" dur="4s" repeatCount="indefinite" /></circle>
      <circle cx="750" cy="35" r="1.5"><animate attributeName="opacity" values="0.1;1;0.1" dur="2.8s" repeatCount="indefinite" /></circle>
      <circle cx="550" cy="70" r="1"><animate attributeName="opacity" values="0.4;1;0.4" dur="3.5s" repeatCount="indefinite" /></circle>
    </g>

    <!-- Modern Kış Süsleri (Klas ruhu korumak için) -->
    <g stroke="#334155" stroke-width="1.5">
      <line x1="450" y1="0" x2="450" y2="25" />
      <circle cx="450" cy="30" r="5" fill="#ef4444" filter="url(#shadow)">
        <animateTransform attributeName="transform" type="rotate" values="3 450 0; -3 450 0; 3 450 0" dur="3s" repeatCount="indefinite" />
      </circle>
      
      <line x1="580" y1="0" x2="580" y2="40" />
      <circle cx="580" cy="46" r="6" fill="#eab308" filter="url(#shadow)">
        <animateTransform attributeName="transform" type="rotate" values="-4 580 0; 4 580 0; -4 580 0" dur="4s" repeatCount="indefinite" />
      </circle>

      <line x1="700" y1="0" x2="700" y2="35" />
      <circle cx="700" cy="41" r="6" fill="#38bdf8" filter="url(#shadow)">
        <animateTransform attributeName="transform" type="rotate" values="-5 700 0; 5 700 0; -5 700 0" dur="3.5s" repeatCount="indefinite" />
      </circle>
    </g>

    <!-- Karlı Dağlar -->
    <path d="M 0 165 Q 200 145 400 165 T 800 150 L 800 200 L 0 200 Z" fill="#0f172a" opacity="0.9" />
    <path d="M 0 175 Q 250 160 500 180 T 800 170 L 800 200 L 0 200 Z" fill="#1e293b" />
    <path d="M 0 187 Q 300 175 600 190 T 800 185 L 800 200 L 0 200 Z" fill="#334155" />

    <!-- Çam Ağacı (Sağ Köşede Modern Vektör) -->
    <g transform="translate(680, 115) scale(0.9)">
      <polygon points="25,0 0,55 50,55" fill="#064e3b" filter="url(#shadow)" />
      <polygon points="25,-10 -5,35 55,35" fill="#065f46" />
      <polygon points="25,-20 -10,20 60,20" fill="#059669" />
      <!-- Yıldız -->
      <path d="M 25 -25 L 28 -18 L 35 -18 L 29 -14 L 31 -7 L 25 -11 L 19 -7 L 21 -14 L 15 -18 L 22 -18 Z" fill="#fde047" filter="url(#glow)">
        <animate attributeName="opacity" values="0.6;1;0.6" dur="2s" repeatCount="indefinite" />
      </path>
    </g>


    <!-- 2. EL VE YAZILIM KARTLARI DESTESİ -->
    <!-- Kartlar ve el grubunu hafifçe yukarı/aşağı hareket ettir -->
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,0; 0,-3; 0,0" dur="4s" repeatCount="indefinite" />
      
      <!-- Kart 1: PostgreSQL -->
      <g transform="translate(60, 65) rotate(-22)">
        <rect width="60" height="90" rx="6" fill="url(#cardGrad)" stroke="#38bdf8" stroke-width="1.5" filter="url(#shadow)" />
        <rect width="50" height="80" x="5" y="5" rx="3" fill="none" stroke="#38bdf8" stroke-width="0.5" opacity="0.3" />
        <!-- Logo -->
        <g transform="translate(15, 20) scale(0.8)">
          <!-- Fil Kafası Minimal -->
          <path d="M20,5 C10,5 5,12 5,20 C5,25 7,30 12,30 L12,25 C10,25 9,23 9,20 C9,13 14,9 20,9 C25,9 28,12 28,16 C28,20 25,23 20,23 C17,23 15,20 15,16 L11,16 C11,22 15,27 20,27 C27,27 32,22 32,16 C32,9 27,5 20,5 Z" fill="#38bdf8" />
          <circle cx="16" cy="15" r="1.5" fill="#ffffff" />
        </g>
        <text x="30" y="70" font-family="monospace" font-size="8" fill="#38bdf8" font-weight="bold" text-anchor="middle">POSTGRE</text>
        <text x="30" y="80" font-family="monospace" font-size="8" fill="#38bdf8" font-weight="bold" text-anchor="middle">SQL</text>
      </g>

      <!-- Kart 2: Python -->
      <g transform="translate(110, 50) rotate(-5)">
        <rect width="60" height="90" rx="6" fill="url(#cardGrad)" stroke="#facc15" stroke-width="1.5" filter="url(#shadow)" />
        <rect width="50" height="80" x="5" y="5" rx="3" fill="none" stroke="#facc15" stroke-width="0.5" opacity="0.3" />
        <!-- Logo -->
        <g transform="translate(15, 25) scale(0.8)">
          <!-- Python Yılanları Minimal -->
          <path d="M15,2 C22,2 25,5 25,10 L25,15 L15,15 C12,15 10,17 10,20 L10,25 L20,25 C25,25 28,22 28,17 L33,17 C33,25 28,30 20,30 L10,30 C5,30 2,27 2,20 L2,10 C2,5 7,2 15,2 Z" fill="#38bdf8" />
          <path d="M22,35 C15,35 12,32 12,27 L12,22 L22,22 C25,22 27,20 27,17 L27,12 L17,12 C12,12 9,15 9,20 L4,20 C4,12 9,7 17,7 L27,7 C32,7 35,10 35,17 L35,27 C35,32 30,35 22,35 Z" fill="#facc15" />
          <circle cx="10" cy="8" r="1.5" fill="#ffffff" />
          <circle cx="27" cy="29" r="1.5" fill="#ffffff" />
        </g>
        <text x="30" y="75" font-family="monospace" font-size="9" fill="#facc15" font-weight="bold" text-anchor="middle">PYTHON</text>
      </g>

      <!-- Kart 3: Java -->
      <g transform="translate(165, 45) rotate(12)">
        <rect width="60" height="90" rx="6" fill="url(#cardGrad)" stroke="#f97316" stroke-width="1.5" filter="url(#shadow)" />
        <rect width="50" height="80" x="5" y="5" rx="3" fill="none" stroke="#f97316" stroke-width="0.5" opacity="0.3" filter="url(#cardGlow)" />
        <!-- Logo -->
        <g transform="translate(16, 20) scale(0.9)">
          <!-- Java Kahve Fincanı -->
          <path d="M5,15 C5,25 25,25 25,15 Z" fill="#f97316" />
          <path d="M25,16 C29,16 31,18 31,20 C31,22 29,24 25,24 L25,16" fill="none" stroke="#f97316" stroke-width="2" />
          <path d="M3,23 Q15,28 27,23" fill="none" stroke="#f97316" stroke-width="2" />
          <!-- Buhar -->
          <path d="M10,12 Q13,8 10,4 T10,-2" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
          <path d="M20,12 Q23,8 20,4 T20,-2" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" />
        </g>
        <text x="30" y="75" font-family="monospace" font-size="11" fill="#f97316" font-weight="bold" text-anchor="middle">JAVA</text>
      </g>

      <!-- Eldiven / El (Kartları tutan stilize, siber/profesyonel el) -->
      <g filter="url(#shadow)">
        <!-- Kol / Bilek kısmı -->
        <path d="M-20,220 L20,120 L80,105 L110,140 L60,220 Z" fill="#0f172a" stroke="#1e293b" stroke-width="2" />
        <!-- Eldiven dış katman -->
        <path d="M-10,220 L30,130 L75,115 L95,145 L40,220 Z" fill="url(#handGrad)" />
        <!-- Kartları tutan Başparmak -->
        <path d="M70,120 L110,110 C120,108 125,115 120,122 L85,150 Z" fill="#1e293b" stroke="#334155" stroke-width="1.5" />
        <!-- Eldiven Parlak Şerit (Neon / Matrix Havası) -->
        <path d="M10,180 L50,115 L60,110" fill="none" stroke="#38bdf8" stroke-width="2" opacity="0.6" filter="url(#glow)" />
      </g>
    </g>


    <!-- 3. TİPOGRAFİ (Elden dolayı hafif sağa hizalanmış) -->
    <g filter="url(#textShadow)">
      <text x="510" y="105" font-family="&#39;Segoe UI&#39;, &#39;Ubuntu&#39;, sans-serif" font-weight="900" font-size="40" fill="url(#textGrad)" text-anchor="middle" letter-spacing="2">BAHADIR OĞUZ YENİCE</text>
      <text x="510" y="135" font-family="&#39;Fira Code&#39;, &#39;Courier New&#39;, monospace" font-weight="600" font-size="14" fill="#38bdf8" text-anchor="middle" letter-spacing="4">BACKEND & SYSTEM ARCHITECT</text>
    </g>

    <!-- Yağan Kar Efekti (Ön Plan) -->
    <g fill="#ffffff">
      <circle cx="150" cy="-10" r="2.5" opacity="0.6"><animate attributeName="cy" from="-10" to="210" dur="4.2s" repeatCount="indefinite" /></circle>
      <circle cx="340" cy="-10" r="2" opacity="0.8"><animate attributeName="cy" from="-10" to="210" dur="5.1s" begin="1.2s" repeatCount="indefinite" /></circle>
      <circle cx="470" cy="-10" r="3" opacity="0.5"><animate attributeName="cy" from="-10" to="210" dur="3.6s" begin="0.5s" repeatCount="indefinite" /></circle>
      <circle cx="615" cy="-10" r="1.5" opacity="0.9"><animate attributeName="cy" from="-10" to="210" dur="6.3s" begin="2.1s" repeatCount="indefinite" /></circle>
      <circle cx="740" cy="-10" r="2.5" opacity="0.7"><animate attributeName="cy" from="-10" to="210" dur="4.8s" begin="0.8s" repeatCount="indefinite" /></circle>
    </g>
  </g>

  <!-- Dış Çerçeve -->
  <rect width="800" height="200" rx="14" fill="none" stroke="#1e293b" stroke-width="2" />
</svg>
