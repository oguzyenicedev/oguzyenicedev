      <circle cx="42" cy="78" r="3" fill="#4ade80"><animate attributeName="opacity" values="1;0.3;1" dur="1.2s" repeatCount="indefinite" /></circle>
    </g>

    
    <path d="M 0,6 Q 100,34 200,6 Q 300,34 400,6 Q 500,34 600,6 Q 700,34 800,6" class="wire" />


    <g>
      <circle cx="50" cy="16" r="4.5" fill="#ff4b4b"><animate attributeName="opacity" values="0.3;1;0.3" dur="1.2s" repeatCount="indefinite" /></circle>
      <circle cx="100" cy="20" r="4.5" fill="#4ade80"><animate attributeName="opacity" values="1;0.3;1" dur="1.2s" repeatCount="indefinite" /></circle>
      <circle cx="150" cy="16" r="4.5" fill="#fde047"><animate attributeName="opacity" values="0.4;1;0.4" dur="1.5s" repeatCount="indefinite" /></circle>
      <circle cx="250" cy="16" r="4.5" fill="#38bdf8"><animate attributeName="opacity" values="1;0.3;1" dur="1.4s" repeatCount="indefinite" /></circle>
      <circle cx="300" cy="20" r="4.5" fill="#ff4b4b"><animate attributeName="opacity" values="0.3;1;0.3" dur="1.1s" repeatCount="indefinite" /></circle>
      <circle cx="350" cy="16" r="4.5" fill="#fde047"><animate attributeName="opacity" values="1;0.4;1" dur="1.3s" repeatCount="indefinite" /></circle>
      <circle cx="450" cy="16" r="4.5" fill="#4ade80"><animate attributeName="opacity" values="0.3;1;0.3" dur="1.4s" repeatCount="indefinite" /></circle>
      <circle cx="500" cy="20" r="4.5" fill="#ff4b4b"><animate attributeName="opacity" values="1;0.3;1" dur="1.2s" repeatCount="indefinite" /></circle>
      <circle cx="550" cy="16" r="4.5" fill="#38bdf8"><animate attributeName="opacity" values="0.3;1;0.3" dur="1.5s" repeatCount="indefinite" /></circle>
      <circle cx="650" cy="16" r="4.5" fill="#fde047"><animate attributeName="opacity" values="1;0.3;1" dur="1.1s" repeatCount="indefinite" /></circle>
    </g>


    <g>
