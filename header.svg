<svg viewBox="0 0 800 180" width="100%" height="180" xmlns="http://www.w3.org/2000/svg">
  <style>
    .bg { fill: #0d1117; rx: 10px; }
    .title { font: 700 32px 'Segoe UI', Ubuntu, Sans-Serif; fill: #ffffff; text-anchor: middle; }
    .subtitle { font: 500 20px 'Fira Code', monospace; fill: #58a6ff; text-anchor: middle; }
    
    .snow { fill: #ffffff; opacity: 0.8; animation: fall linear infinite; }
    .s1 { animation-duration: 5s; }
    .s2 { animation-duration: 7s; animation-delay: 2s; }
    .s3 { animation-duration: 4s; animation-delay: 1s; }
    
    @keyframes fall {
      0% { transform: translateY(-20px); opacity: 0; }
      20% { opacity: 0.9; }
      100% { transform: translateY(190px); opacity: 0.2; }
    }

    .light-red { fill: #ff4b4b; animation: glowRed 1.5s infinite alternate; }
    .light-green { fill: #2ea043; animation: glowGreen 1.5s infinite alternate; }
    .light-gold { fill: #e3b341; animation: glowGold 1.5s infinite alternate; }

    @keyframes glowRed { from { opacity: 0.4; } to { opacity: 1; filter: drop-shadow(0 0 6px #ff4b4b); } }
    @keyframes glowGreen { from { opacity: 0.4; } to { opacity: 1; filter: drop-shadow(0 0 6px #2ea043); } }
    @keyframes glowGold { from { opacity: 1; filter: drop-shadow(0 0 6px #e3b341); } to { opacity: 0.4; } }
  </style>

  <rect width="100%" height="100%" class="bg" />

  <circle cx="50" cy="15" r="5" class="light-red" />
  <circle cx="150" cy="15" r="5" class="light-green" />
  <circle cx="250" cy="15" r="5" class="light-gold" />
  <circle cx="350" cy="15" r="5" class="light-red" />
  <circle cx="450" cy="15" r="5" class="light-green" />
  <circle cx="550" cy="15" r="5" class="light-gold" />
  <circle cx="650" cy="15" r="5" class="light-red" />
  <circle cx="750" cy="15" r="5" class="light-green" />

  <circle cx="80" cy="0" r="2.5" class="snow s1" />
  <circle cx="220" cy="0" r="1.5" class="snow s2" />
  <circle cx="340" cy="0" r="3" class="snow s3" />
  <circle cx="480" cy="0" r="2" class="snow s1" />
  <circle cx="600" cy="0" r="2.5" class="snow s2" />
  <circle cx="720" cy="0" r="1.8" class="snow s3" />

  <text x="400" y="85" class="title">🎄 Oguz Yenice 🎄</text>
  <text x="400" y="130" class="subtitle">Backend Engineering & System Architecture</text>
</svg>
